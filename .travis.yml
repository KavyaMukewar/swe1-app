language: python
dist: jammy
python:
  - "3.12"

install:
  - pip install -r requirements.txt
  - pip install black flake8 coverage coveralls

script:
  - black --check .
  - flake8 .
  - coverage run manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  region: us-east-1
  app: swe1-app
  env: swe1-app-env
  bucket: elasticbeanstalk-us-east-1-190716021662
  on:
    branch: main
